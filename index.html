<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Práctica DOP 11-26</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rosa-fondo1: #FFE3EF;
    --rosa-fondo2: #FFD1E3;
    --rosa-fuerte: #FF5FA2;
    --rosa-medio: #FF8FC4;
    --rosa-suave: #FFD6E8;
    --morado-uva: #C86FC9;
    --blanco-crema: #FFF8FB;
    --texto-oscuro: #7A2E55;
    --exito: #7ED6A5;
    --error: #FF7A9C;
    --sombra: rgba(255, 95, 162, 0.25);
  }

  *{ box-sizing: border-box; }

  body{
    margin:0;
    min-height:100vh;
    font-family:'Quicksand', sans-serif;
    color: var(--texto-oscuro);
    background: linear-gradient(160deg, var(--rosa-fondo1) 0%, var(--rosa-fondo2) 55%, #FFC9E0 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
    position:relative;
    overflow-x:hidden;
  }

  .app{
    position:relative;
    z-index:1;
    width:100%;
    max-width: 560px;
  }

  .marca{
    text-align:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:800;
    font-size: 26px;
    color: var(--rosa-fuerte);
    margin-bottom: 14px;
    letter-spacing: 0.5px;
    text-shadow: 0 2px 0 #fff;
  }
  .marca span{ color: var(--morado-uva); }

  .tarjeta{
    background: var(--blanco-crema);
    border-radius: 32px;
    padding: 32px 28px 28px;
    box-shadow: 0 20px 45px var(--sombra), 0 2px 0 #fff inset;
    border: 3px solid #fff;
    position: relative;
    overflow:hidden;
  }

  .tarjeta::before{
    content:"";
    position:absolute;
    top:-60px; right:-60px;
    width:160px; height:160px;
    background: var(--rosa-suave);
    border-radius:50%;
    opacity:0.6;
  }

  .progreso{
    display:flex;
    justify-content:center;
    flex-wrap: wrap; 
    gap:4px;
    margin-bottom: 22px;
    position:relative;
  }
  .progreso .punto{
    width:8px; height:8px;
    border-radius:50%;
    background: var(--rosa-suave);
    transition: all .3s ease;
  }
  .progreso .punto.activo{
    background: var(--rosa-fuerte);
    transform: scale(1.3);
  }
  .progreso .punto.hecho{
    background: var(--morado-uva);
  }

  .contador{
    text-align:center;
    font-size: 14px;
    font-weight:700;
    color: var(--morado-uva);
    margin-bottom: 6px;
    position:relative;
  }

  .pregunta{
    font-family:'Baloo 2', sans-serif;
    font-size: 21px;
    font-weight: 700;
    line-height: 1.4;
    text-align:center;
    margin: 6px 0 26px;
    color: var(--texto-oscuro);
    position:relative;
  }

  .opciones{
    display:flex;
    flex-direction:column;
    gap: 12px;
    position:relative;
  }

  .opcion{
    display:flex;
    align-items:center;
    gap: 12px;
    background: #fff;
    border: 2.5px solid var(--rosa-suave);
    border-radius: 18px;
    padding: 14px 16px;
    font-family:'Quicksand', sans-serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--texto-oscuro);
    cursor:pointer;
    text-align:left;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
  }
  .opcion .letra{
    flex:0 0 auto;
    width: 30px; height: 30px;
    border-radius:50%;
    background: var(--rosa-suave);
    color: var(--rosa-fuerte);
    display:flex; align-items:center; justify-content:center;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 14px;
    transition: all .15s ease;
  }

  .opcion:hover:not(.bloqueada){
    transform: translateY(-2px) scale(1.01);
    border-color: var(--rosa-medio);
    background: #FFF5FA;
  }

  .opcion.seleccionada{
    border-color: var(--rosa-fuerte);
    background: #FFEAF4;
  }

  .opcion.correcta{
    border-color: var(--exito);
    background: #EAFBF2;
  }
  .opcion.correcta .letra{ background: var(--exito); color:#fff; }

  .opcion.incorrecta{
    border-color: var(--error);
    background: #FFEEF2;
  }
  .opcion.incorrecta .letra{ background: var(--error); color:#fff; }

  .opcion.bloqueada{ cursor:default; }

  .mensaje{
    min-height: 26px;
    text-align:center;
    font-weight:700;
    font-family:'Baloo 2', sans-serif;
    font-size:15px;
    margin-top: 16px;
    transition: opacity .2s ease;
  }
  .mensaje.ok{ color: #3FAE7C; }
  .mensaje.no{ color: var(--error); }

  .acciones{
    display:flex;
    justify-content:center;
    margin-top: 20px;
    position:relative;
  }

  .btn-siguiente{
    background: linear-gradient(135deg, var(--rosa-fuerte), var(--morado-uva));
    color:#fff;
    border:none;
    padding: 13px 34px;
    border-radius: 999px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    font-size: 16px;
    cursor:pointer;
    box-shadow: 0 10px 20px var(--sombra);
    opacity:0;
    transform: translateY(8px);
    pointer-events:none;
    transition: all .25s ease;
  }
  .btn-siguiente.mostrar{
    opacity:1;
    transform: translateY(0);
    pointer-events:auto;
  }
  .btn-siguiente:hover{ filter: brightness(1.06); transform: translateY(-2px); }
  .btn-siguiente:active{ transform: translateY(0); }

  /* pantalla final */
  .final{
    text-align:center;
    display:none;
    position:relative;
  }
  .final.mostrar{ display:block; }
  .final h2{
    font-family:'Baloo 2', sans-serif;
    color: var(--rosa-fuerte);
    font-size: 24px;
    margin: 6px 0;
  }
  .final p{ font-size:16px; font-weight:600; }
  .final .puntaje{
    font-family:'Baloo 2', sans-serif;
    font-size: 42px;
    color: var(--morado-uva);
    margin: 10px 0;
  }
  .btn-reiniciar{
    margin-top: 16px;
    background: #fff;
    border: 2.5px solid var(--rosa-fuerte);
    color: var(--rosa-fuerte);
    padding: 11px 28px;
    border-radius: 999px;
    font-family:'Baloo 2', sans-serif;
    font-weight:700;
    cursor:pointer;
    transition: all .2s ease;
  }
  .btn-reiniciar:hover{ background: var(--rosa-fuerte); color:#fff; }

  @media (max-width: 420px){
    .tarjeta{ padding: 26px 18px 22px; border-radius: 24px; }
    .pregunta{ font-size: 18px; }
  }
</style>
</head>
<body>

<div class="app">
  <div class="marca">Quiz <span>DOP 11-26</span></div>

  <div class="tarjeta">
    <!-- vista de pregunta -->
    <div id="vistaPregunta">
      <div class="progreso" id="progreso"></div>
      <div class="contador" id="contador"></div>
      <div class="pregunta" id="textoPregunta"></div>
      <div class="opciones" id="opciones"></div>
      <div class="mensaje" id="mensaje"></div>
      <div class="acciones">
        <button class="btn-siguiente" id="btnSiguiente">Siguiente</button>
      </div>
    </div>

    <!-- vista final -->
    <div class="final" id="vistaFinal">
      <h2 id="tituloFinal">¡Cuestionario completado!</h2>
      <p>Tu puntaje fue:</p>
      <div class="puntaje" id="puntajeFinal">0/0</div>
      <p id="mensajeFinal"></p>
      <button class="btn-reiniciar" id="btnReiniciar">Volver a intentar</button>
    </div>
  </div>
</div>

<script>
  // Banco Maestro de 250 Preguntas
  preguntasMaestras = [
    {p:"Proporcionar los principios fundamentales que unifiquen y orienten el pensamiento, lenguaje y acción relativa al planeamiento, organización, ejecución y comando y control de las acciones para la protección de la fuerza, se refiere a:",o:["Finalidad","Objeto","Alcance","Definición"],c:1},
    {p:"Puede ser empleada por todo el personal en servicio de la Fuerza Aérea; su contenido es autoritativo pero no restrictivo, se refiere a:",o:["Objeto","Finalidad","Alcance","Definición"],c:2},
    {p:"Establecer la Doctrina Operacional de la Protección de la Fuerza, se refiere a:",o:["Finalidad","Alcance","Definición","Objeto"],c:3},
    {p:"Las abreviaturas y los términos empleados en la Doctrina se encuentran definidos en:",o:["Anexos A y B","Capítulo I","Capítulo VI","Anexo C"],c:0},
    {p:"Documento que establece la Doctrina Operacional de Protección de la Fuerza de la FAP:",o:["DOFA 1-63","DOFA 1-11","DOFA 1-42","DOFA 1-4"],c:0},
    {p:"La DOFA 1-63 anterior (dejada sin efecto) databa del:",o:["08 de octubre de 2023","19 de agosto de 2016","01 de marzo de 2024","28 de febrero de 2024"],c:1},
    {p:"Fecha de aprobación de la vigente DOFA 1-63 'Doctrina Operacional de Protección de la Fuerza':",o:["19 de agosto de 2016","08 de octubre de 2023","28 de febrero de 2024","01 de marzo de 2024"],c:3},
    {p:"Resolución Directoral que aprueba la vigente Doctrina Operacional de Protección de la Fuerza:",o:["N° 0003-EMGRA","N° 0008-2023-DE","DOFA 1-11","DOFA 1-42"],c:0},
    {p:"Autoridad que firma la Resolución Directoral de aprobación como Jefe del Estado Mayor General de la FAP:",o:["Rubén Samuel Gambarini Oñath","Comandante General FAP","JFACC","Jefe del Centro de Doctrina"],c:0},
    {p:"Según el Decreto Supremo N° 008-2023-DE, orientar la revisión y actualización de la doctrina institucional, así como aprobar las doctrinas del nivel operacional, es función de:",o:["Comando de Operaciones","EMGRA","Centro de Doctrina","Alas Aéreas"],c:1},
    {p:"Escuela responsable del Programa de Perfeccionamiento a Distancia (PPD) donde se enmarca la presente doctrina:",o:["EMGRA","CAOC","JFAC","ESCAP"],c:3},
    {p:"Formular, desarrollar y difundir la Doctrina Institucional acorde con la visión, misión y objetivos de la FAP, es función de:",o:["EMGRA","Comando de Operaciones","Dirección General de Educación y Doctrina","Alas Aéreas"],c:2},
    {p:"Las doctrinas son de carácter permanente hasta que las lecciones aprendidas, el tiempo o los cambios científico-tecnológicos obliguen a su actualización; el tiempo de permanencia para la revisión será:",o:["Cada 10 años","Cada 5 años","Nunca se revisa","A partir de su puesta en vigencia"],c:3},
    {p:"Dirección encargada de la difusión de la doctrina aprobada, según la Resolución Directoral:",o:["Comando de Operaciones","EMGRA","Comandancia General","Dirección General de Educación y Doctrina"],c:3},
    {p:"El contenido de la presente Doctrina Operacional es:",o:["Restrictivo y obligatorio en todo","Autoritativo pero no restrictivo","Solo referencial sin valor doctrinario","Aplicable únicamente en tiempo de guerra"],c:1},
    {p:"La Protección de la Fuerza (FP) es el ámbito en el que se centra:",o:["La protección","El ataque","La disuasión nuclear","La inteligencia"],c:0},
    {p:"Conjunto de esfuerzos para asegurar y defender la eficacia y capacidad de supervivencia del personal, equipos, instalaciones, información e infraestructuras, se refiere a:",o:["Gestión de riesgos","Actividades de Protección de la Fuerza","Inteligencia de Protección de Fuerzas","OPSEC"],c:1},
    {p:"La FP consiste en la adopción de medidas preventivas para evitar o mitigar acciones del enemigo y amenazas internas; se considera un principio fundamental de:",o:["Solo operaciones aéreas ofensivas","Solo la defensa NBC","Todas las operaciones y acciones militares","Solo la seguridad de la información"],c:2},
    {p:"La principal tarea de la FP para la FAP es la protección de:",o:["Su personal","Sus aeronaves","Su presupuesto","Su información clasificada"],c:0},
    {p:"Típicamente, la mayoría de las responsabilidades de FP son llevadas a cabo por:",o:["El personal médico","Las fuerzas de seguridad de la instalación","El personal de inteligencia únicamente","La Policía Nacional"],c:1},
    {p:"El adiestramiento en técnicas básicas de combate en tierra incluye, entre otros aspectos:",o:["Vuelo instrumental","Diseño de sistemas de armas","Familiarización con armas y atención táctica de bajas en combate","Meteorología aeronáutica"],c:2},
    {p:"Todo el personal militar debe estar en capacidad de reconocer e informar sobre peligros de armas:",o:["Solo nucleares","Solo convencionales","Solo biológicas","CBRNE"],c:3},
    {p:"CBRNE corresponde a armas:",o:["Convencionales, Balísticas, Radioeléctricas, Navales y Especiales","Químicas, Biológicas, Radiológicas, Nucleares y de Alto Poder Explosivo","Cibernéticas, Bélicas, Regulares, Navales y Estratégicas","Combinadas, Blindadas, Regulares, Nucleares y Especiales"],c:1},
    {p:"El personal encargado de la recolección de información que debe proporcionar una imagen de la amenaza es el personal de:",o:["Logística","Sanidad","Inteligencia","Capellanía"],c:2},
    {p:"La FP abarca acciones en el lugar de origen, en tránsito y en lugares de despliegue; esto la define como:",o:["Unidimensional","Exclusivamente táctica","Solo estratégica","Multidimensional y multinivel"],c:3},
    {p:"Componente clave de la FP que consiste en proteger los Elementos Esenciales de Información Propia, cuyo cumplimiento se espera de todo el personal:",o:["CIFP","FPI","RM","OPSEC"],c:3},
    {p:"El resultado final de la FP es contar con fuerzas capaces de cumplir sus misiones con la mejor protección disponible, basada en:",o:["La eliminación total de amenazas","El desarme unilateral","La improvisación táctica","La gestión de riesgos"],c:3},
    {p:"Las amenazas a la Institución son, entre otras características:",o:["Siempre previsibles con meses de anticipación","Exclusivas de zonas de combate declaradas","Solo de origen estatal","Impredecibles y pueden presentarse en cualquier momento"],c:3},
    {p:"La tecnología aplicada a la FP debe:",o:["Sustituir completamente al personal","Eliminar la necesidad de vigilancia continua","Reemplazar la inteligencia humana","Mejorar las capacidades del personal, no sustituirlas"],c:3},
    {p:"El primer paso para desarrollar un programa eficaz de FP es:",o:["Adquirir armamento de última generación","Reducir el personal de seguridad","Suspender las operaciones aéreas","Comprender cómo funcionan las amenazas"],c:3},
    {p:"Protección contra amenazas aéreas hostiles mediante defensa aérea activa y pasiva, incluyendo contrarrestar UAV, corresponde a un(a):",o:["Principio de FP","Efecto de FP","Nivel de amenaza","Medio de Protección de la Fuerza"],c:3},
    {p:"Protección de la información mediante seguridad del ciberespacio, operaciones cibernéticas defensivas y guerra electrónica, corresponde a:",o:["Una medida pasiva únicamente","Un medio de Protección de la Fuerza","Un principio de coordinación","Un nivel de amenaza"],c:1},
    {p:"Defensa de bases, seguridad física, programas antiterroristas y protección contra amenazas internas, corresponden al medio de FP para proteger:",o:["Solo las aeronaves","Solo la información clasificada","Personal, bases e infraestructura","Solo al Comandante"],c:2},
    {p:"La defensa CBRNE tiene como objetivo:",o:["Eliminar toda amenaza nuclear mundial","Sustituir a la defensa aérea","Reemplazar la seguridad física","Minimizar los ataques e incidentes CBRNE"],c:3},
    {p:"La gestión de emergencias y respuesta es uno de los:",o:["Niveles de amenaza","FPCON","Anexos de la Doctrina","Medios de Protección de la Fuerza"],c:3},
    {p:"Medidas, cometidos y actividades para evitar, prevenir, anular o reducir la efectividad de un ataque enemigo, se refiere a medidas:",o:["Pasivas","De recuperación","Procedimentales","Activas"],c:3},
    {p:"Medidas, cometidos y actividades que pretenden minimizar los efectos de las amenazas para aumentar el grado de supervivencia de la Fuerza, se refiere a medidas:",o:["Activas","De recuperación","Pasivas","Materiales"],c:2},
    {p:"Las medidas activas de FP deben aplicarse conforme al tipo de actividades para el cumplimiento de la misión, a las ROE y a:",o:["Solo la opinión del Jefe de Seguridad","El criterio individual de cada aviador","Las normas civiles de tránsito","Los Procedimientos Operativos Vigentes (POV)"],c:3},
    {p:"Deben desarrollarse medidas para desalentar las acciones adversarias, siendo vital la existencia de una amenaza comprobada; este efecto se denomina:",o:["Detectar","Retrasar","Negar","Disuadir"],c:3},
    {p:"Deben desarrollarse medidas para identificar la presencia de un objeto o suceso de posible interés militar; este efecto se denomina:",o:["Disuadir","Detectar","Derrotar","Retrasar"],c:1},
    {p:"Las fuerzas utilizan el terreno, barreras, obstáculos y armas en último lugar para dar tiempo a que la base tome medidas defensivas; este efecto se denomina:",o:["Detectar","Negar","Retrasar","Disuadir"],c:2},
    {p:"Impedir el posicionamiento del adversario para causar efectos sobre las fuerzas, incluyendo impedir el acceso a los recursos, corresponde al efecto:",o:["Detectar","Retrasar","Derrotar","Negar"],c:3},
    {p:"Derrotar rápidamente a un adversario es clave para mantener la iniciativa de una fuerza defensora; este efecto se enfoca en:",o:["Negociar con el adversario","Evacuar la instalación","Suspender la misión","Derrotar a los adversarios antes de que causen daños significativos"],c:3},
    {p:"Son los cinco efectos de la Protección de la Fuerza:",o:["Prevenir, Proteger, Reaccionar, Evacuar, Recuperar","Priorizar, Coordinar, Flexibilizar, Interoperar, Valorar","Analizar, Planificar, Ejecutar, Supervisar, Revisar","Disuadir, Detectar, Retrasar, Negar, Derrotar"],c:3},
    {p:"Requiere priorizar medidas de acuerdo con la misión, situación, riesgos, amenaza y escenario, dado que es imposible adoptar todas las medidas deseables; este principio se denomina:",o:["Coordinación","Flexibilidad","Interoperabilidad","Priorización"],c:3},
    {p:"Es necesario realizar previamente una identificación y evaluación de la amenaza en base a la información e inteligencia disponible; este principio se denomina:",o:["Priorización","Análisis y Gestión del Riesgo","Coordinación","Valoración de Amenazas"],c:3},
    {p:"La FP debe estar basada en la gestión de riesgo y no en la eliminación total de las amenazas; este principio se denomina:",o:["Valoración de Amenazas","Flexibilidad","Priorización","Análisis y Gestión del Riesgo"],c:3},
    {p:"Permite que el Comandante en cada nivel adopte las medidas más oportunas mediante la divulgación oportuna de información; este principio se denomina:",o:["Interoperabilidad","Flexibilidad","Priorización","Coordinación"],c:3},
    {p:"Necesidad de la mayor compatibilidad posible en cuestiones de FP para operar de manera conjunta o combinada; este principio se denomina:",o:["Coordinación","Flexibilidad","Priorización","Interoperabilidad"],c:3},
    {p:"El grado y medidas de FP deben ser lo suficientemente adaptables debido a los recursos limitados; este principio se denomina:",o:["Coordinación","Priorización","Valoración de Amenazas","Flexibilidad"],c:3},
    {p:"Son los seis principios de Protección de la Fuerza:",o:["Disuadir, Detectar, Retrasar, Negar, Derrotar y Recuperar","Prevención, Protección, Reacción y Retardo","Seguridad, Contrainteligencia e Ingeniería","Priorización, Valoración de Amenazas, Análisis y Gestión del Riesgo, Coordinación, Interoperabilidad y Flexibilidad"],c:3},
    {p:"Las áreas de aplicación de la Protección de la Fuerza son cinco; señale la que NO corresponde:",o:["Protección contra la amenaza no convencional","Protección Sanitaria","Inteligencia de Señales","Protección en la Seguridad"],c:2},
    {p:"Sistema organizado de medidas aplicadas en todos los niveles de mando cuyo objetivo es mantener un entorno operativo seguro, se refiere al área de:",o:["Protección Sanitaria","Defensa NBC","Protección en la Seguridad","Protección Funcional"],c:2},
    {p:"Engloba medidas que proceden del empleo de formas de actuación de la amenaza híbrida, requiriendo un planeamiento Ad Hoc:",o:["Protección en la Seguridad","Protección Sanitaria","Protección Funcional","Protección Contra la Amenaza No Convencional"],c:3},
    {p:"Engloba las medidas sanitarias adoptadas para conservar y promover la salud física y mental del combatiente:",o:["Defensa NBC","Protección Funcional","Protección en la Seguridad","Protección Sanitaria"],c:3},
    {p:"Área específica de actuación en el campo de la medicina preventiva y salud pública, incluyendo vacunación y vigilancia epidemiológica:",o:["Protección Funcional","Defensa NBC","Seguridad Física","Protección Sanitaria"],c:3},
    {p:"Determina el nivel de despliegue y activación de las capacidades de Protección Física conforme a la amenaza existente:",o:["Protección Sanitaria","Protección Funcional","Protección en la Seguridad","Defensa NBC"],c:3},
    {p:"Comprende el conjunto de medidas para garantizar un entorno de trabajo seguro y saludable, incluyendo seguridad vial y contra incendios:",o:["Protección Sanitaria","Defensa NBC","Protección en la Seguridad","Protección Funcional"],c:3},
    {p:"La Protección en la Seguridad incluye medidas en cinco áreas; señale la que NO corresponde:",o:["Seguridad de la información","Seguridad física","Recuperación de personal","Seguridad en el personal"],c:2},
    {p:"Comprende medidas para comprobar el grado de fiabilidad, honradez y lealtad de las personas para ocupar un puesto determinado:",o:["Seguridad de la Información","Seguridad Física","OPSEC","Seguridad en el Personal"],c:3},
    {p:"Comprende medidas y procedimientos que salvaguardan la información de actos hostiles, pérdidas o revelaciones no autorizadas:",o:["Seguridad en el Personal","Seguridad Física","Seguridad de la Organización","Seguridad de la Información"],c:3},
    {p:"Constituyen la primera barrera defensiva y la base de la ciberdefensa:",o:["Las medidas de seguridad física perimetral","La protección sanitaria","La defensa NBC","Las sólidas medidas de seguridad de la información en sistemas de información y telecomunicaciones"],c:3},
    {p:"Abarca medidas para proteger al personal, equipo, suministros y materiales frente a daños intencionados o fortuitos, incluida la autoprotección:",o:["Seguridad de la Información","OPSEC","Seguridad de la Organización","Seguridad Física"],c:3},
    {p:"En el área de Seguridad Física adquieren especial importancia la defensa pasiva, los medios técnicos de seguridad y:",o:["La vacunación","La ciberdefensa","La recuperación de personal","Las medidas de control de accesos"],c:3},
    {p:"Protege los Elementos Esenciales de Información Propia (EEI) contra la obtención de información del adversario y filtraciones no autorizadas:",o:["Seguridad en el Personal","Seguridad de la Organización","Seguridad Física","Seguridad de las Operaciones (OPSEC)"],c:3},
    {p:"Comprende actividades para prevenir que el personal militar se vea involucrado en asuntos contra el buen nombre de la FAP, incluyendo frente a campañas de desinformación:",o:["Seguridad de la Información","OPSEC","Seguridad en el Personal","Seguridad de la Organización"],c:3},
    {p:"Las actividades de contrainteligencia dentro de la Seguridad en el Personal permiten:",o:["Sustituir la vacunación","Eliminar la seguridad física","Reemplazar el OPSEC","Prevenir la materialización del riesgo detectado"],c:3},
    {p:"El tratamiento de la información clasificada se realiza conforme a:",o:["El criterio personal del Jefe de Seguridad","Las costumbres locales","Ninguna normativa específica","La normativa aplicable"],c:3},
    {p:"La Protección de la Fuerza persigue el equilibrio entre:",o:["El ataque y la defensa","La ofensiva y la retirada","El presupuesto y el personal","La seguridad y el cumplimiento de la misión"],c:3},
    {p:"La sincronización de las actividades de FP se garantiza mediante medidas mitigadoras:",o:["Solo activas","Solo pasivas","Procedimentales únicamente","Activas y pasivas"],c:3},
    {p:"La Protección de la Fuerza comprende, entre otras, las actividades de seguridad, contrainteligencia, ingenieros, defensa pasiva, recuperación de personal, protección sanitaria y:",o:["Únicamente ciberdefensa","Únicamente defensa aérea","Únicamente inteligencia de señales","Defensa nuclear, química y bacteriológica (NBC)"],c:3},
    {p:"En el esquema gráfico de Áreas de Aplicación de la FP, en el centro se encuentra la balanza que representa:",o:["Ataque Vs Defensa","Costo Vs Beneficio","Personal Vs Material","Seguridad Vs Libertad de Acción"],c:3},
    {p:"El éxito de la misión depende, entre otros aspectos, del grado de equilibrio entre:",o:["El armamento y el presupuesto","La antigüedad y el rango del personal","La meteorología y el terreno","La protección de la fuerza y la libertad de acción del Comandante"],c:3},
    {p:"Todos los aviadores contribuyen a la:",o:["Defensa Aérea únicamente","Inteligencia de Señales únicamente","Seguridad Sanitaria únicamente","Protección de la Fuerza (FP)"],c:3},
    {p:"La FP incluye la protección de miembros militares, civiles, familias, empleados contratados y:",o:["Únicamente al personal de alto mando","Únicamente a las aeronaves","Únicamente al personal en actividad, excluyendo civiles","Los visitantes en una instalación donde se desarrollen actividades de la Institución"],c:3},
    {p:"Entre la experiencia funcional necesaria para la FP se incluyen recopilación de inteligencia, concienciación, detección de amenazas, mejoras de seguridad física, defensa armada y:",o:["La meteorología aeronáutica exclusivamente","El diseño de aeronaves","La contabilidad institucional","El enlace con las fuerzas de seguridad"],c:3},
    {p:"A través del enfoque de múltiples niveles, la FP extiende la concienciación e influencia, proporcionando:",o:["Protección exclusiva al perímetro","Protección solo en tiempos de guerra","Protección solo a las aeronaves en vuelo","Protección en profundidad al personal y recursos de la Institución"],c:3},
    {p:"Las amenazas a la Institución pueden operar:",o:["Únicamente en el dominio aéreo","Únicamente en el ciberespacio","Únicamente en instalaciones militares","En y a través de múltiples dominios"],c:3},
    {p:"Las tácticas de los adversarios pueden incluir tanto métodos convencionales como:",o:["Exclusivamente navales","Exclusivamente diplomáticos","Exclusivamente económicos","Asimétricos"],c:3},
    {p:"Los Comandantes deben preocuparse no solo por la naturaleza de las amenazas, sino también por:",o:["El color del uniforme","El clima institucional","La antigüedad del personal","Sus efectos previstos"],c:3},
    {p:"Los esfuerzos efectivos de inteligencia, contrainteligencia y enlace son críticos para:",o:["Sustituir a las fuerzas de seguridad","Reemplazar el planeamiento operativo","Eliminar la necesidad de FPCON","Identificar, analizar y diseminar información sobre amenazas"],c:3},
    {p:"El personal militar debe ser consciente de las amenazas evaluadas y factores de FP:",o:["Solo durante operaciones de combate","Solo durante ejercicios programados","Solo en horario de oficina","En todo momento, ya sea en guarnición o desplegado"],c:3},
    {p:"La FAP debe adoptar medidas enérgicas para proteger al personal, recursos e instalaciones:",o:["Únicamente en Lima","Únicamente en bases aéreas principales","Únicamente durante conflictos declarados","En todo el territorio nacional y en comisiones en el extranjero"],c:3},
    {p:"Una fuerza aérea debe ser capaz de:",o:["Depender exclusivamente de fuerzas aliadas","Renunciar a la protección en tiempos de paz","Delegar toda protección a la Policía Nacional","Proteger plenamente a sus fuerzas"],c:3},
    {p:"La FP es parte del apoyo al combate y es una responsabilidad esencial y primaria de:",o:["El personal de sanidad","El personal civil contratado","La Dirección de Educación y Doctrina","El Comandante"],c:3},
    {p:"Los Comandantes de todos los niveles deben establecer:",o:["Un programa de ascensos acelerado","Un plan de reducción de personal","Un plan de reducción presupuestal","Un programa eficaz de FP"],c:3},
    {p:"Aunque la FP puede desviar recursos disponibles, los Comandantes deben:",o:["Ignorar las actividades de FP","Delegar toda la FP a terceros sin supervisión","Suspender las operaciones aéreas","Equilibrar el cumplimiento de la misión con las actividades de FP"],c:3},
    {p:"Para apoyar la gama de requisitos de FP de un Comandante, todo el personal militar debe estar:",o:["Exento de entrenamiento en combate terrestre","Dedicado exclusivamente a tareas administrativas","Autorizado a portar armas sin entrenamiento","Entrenado y equipado para defender las instalaciones contra las amenazas"],c:3},
    {p:"Para contrarrestar amenazas transnacionales, el personal debe comprender su naturaleza y los medios para:",o:["Ignorarlas hasta que se materialicen","Delegarlas a organismos internacionales","Reportarlas solo si son de Nivel III","Observarlas, informar sobre ellas y ejecutar acciones contra ellas"],c:3},
    {p:"El personal de operaciones puede llevar a cabo misiones para defender una instalación o:",o:["Sustituir al personal médico","Reemplazar a la Policía Nacional","Suspender el planeamiento de la misión","Derrotar amenazas inmediatas a la misma"],c:3},
    {p:"La FP es una tarea de:",o:["Todos los Comandantes, en todos los niveles","Solo el Comandante General","Solo el Jefe de Seguridad","Solo el personal de inteligencia"],c:0},
    {p:"Los Comandantes deben comprender la base legal de sus responsabilidades y:",o:["Sus jurisdicciones","El presupuesto asignado únicamente","El organigrama institucional únicamente","Los reglamentos de tránsito únicamente"],c:0},
    {p:"Los Comandantes son los directos responsables de proteger a la fuerza dentro de sus:",o:["Zonas de Seguridad de la Base (BSZ) únicamente","Centros de Operaciones Aéreas","Perímetros de instalaciones civiles","Áreas de Responsabilidad (AOR)"],c:3},
    {p:"La única naturaleza que el esfuerzo de la FP requiere es ser:",o:["Exclusivo del nivel táctico","Delegado completamente a terceros","Aplicado solo en tiempo de guerra","Coordinado e integrado en el más alto nivel y a través de todas las áreas funcionales"],c:3},
    {p:"Ejerce control sobre el programa de protección, entrenamiento, reclutamiento y desarrollo de la política de protección:",o:["El Comando de Operaciones","Las Unidades","El JFACC","El Comandante General de la Fuerza Aérea (CG-FAP)"],c:3},
    {p:"La función primaria del CG-FAP descansa en:",o:["La elaboración del glosario doctrinario","El diseño de aeronaves","La supervisión del tránsito vehicular","La asignación de fuerzas adicionales y fondos necesarios para la FP"],c:3},
    {p:"Es responsable de organizar, entrenar y equipar las fuerzas, autorizando la coordinación funcional de los organismos:",o:["El CG-FAP","Las Unidades","El JFC","El Comando de Operaciones"],c:3},
    {p:"El Comando de Operaciones coordina con los Comandos de Fuerza y Unidades la atención de:",o:["El presupuesto anual","Las políticas de ascenso","Los horarios de vuelo","Sus requerimientos"],c:3},
    {p:"Deben dar impulso a los requerimientos de protección presentándolos al Comando de Operaciones:",o:["El CG-FAP","El JFACC","El JFC","Las Unidades"],c:3},
    {p:"Un Oficial General ejercerá funciones de Comandante del Componente Aéreo de la Fuerza Conjunta, contando con medios para las misiones asignadas por el JFC; esto corresponde a:",o:["CG-FAP","BSZ","CIFP","JFACC"],c:3},
    {p:"El JFACC dependerá operativa y administrativamente de:",o:["El CG-FAP","La Dirección de Educación y Doctrina","La Policía Nacional","El JFC"],c:3},
    {p:"El JFACC estará al mismo nivel que los Comandantes de los Componentes:",o:["Cibernético y Espacial únicamente","Logístico y Administrativo","Sanitario y de Inteligencia","Terrestre y Marítimo"],c:3},
    {p:"Sirve de elemento de planeamiento, coordinación y supervisión para todas las operaciones, incluso las de FP:",o:["El Comando de Operaciones únicamente","La Dirección General de Educación y Doctrina","La ESCAP","El Estado Mayor del JFACC"],c:3},
    {p:"Son esenciales para la protección eficaz de las fuerzas contra toda amenaza:",o:["El control descentralizado total sin coordinación","La eliminación de la jerarquía de mando","La supresión del planeamiento operativo","El control centralizado de los recursos para la FP y la ejecución descentralizada de las medidas"],c:3},
    {p:"Desde aquí se planea y ejecuta la realización de operaciones diarias, efectivizando las operaciones de FP:",o:["El JFC","La ESCAP","El Anexo C","El Centro de Operaciones Aéreas Conjuntas (CAOC)"],c:3},
    {p:"En tiempo de paz, tienen la responsabilidad de proteger a las unidades bajo su mando y las desplegadas en su área de responsabilidad:",o:["El JFC únicamente","La Policía Nacional","El Ministerio de Defensa","Las Alas Aéreas"],c:3},
    {p:"Los Comandantes Generales de Alas Aéreas enfrentan tres retos para la FP; señale el que NO corresponde:",o:["Entrenamiento para la FP","Planeamiento para su integración y apoyo","Proveer las fuerzas asignadas para la FP","Elaborar el glosario de términos institucional"],c:3},
    {p:"Uno de los retos es el planeamiento para su integración y apoyo como tarea asignada aplicable a:",o:["Solo las actividades administrativas","Solo las actividades de mantenimiento","Solo las actividades de vuelo","Todas las actividades de la Fuerza Aérea"],c:3},
    {p:"La estructura organizacional del JFAC puede ser modificada por:",o:["El Ministerio de Defensa exclusivamente","La Policía Nacional","El Congreso de la República","Su Comandante, para ajustarse a las necesidades específicas de la misión"],c:3},
    {p:"El JFACC dependerá del JFC y estará al mismo nivel que:",o:["Los Jefes de Escuadrón","Los suboficiales de guardia","El personal civil contratado","Los Comandantes de los Componentes Terrestre y Marítimo"],c:3},
    {p:"La relación del Comando con la Comandancia General implica que el CG-FAP ejerce control sobre:",o:["Únicamente el reclutamiento","Únicamente los efectivos","Únicamente el entrenamiento físico","El programa de protección, entrenamiento, reclutamiento y desarrollo de política"],c:3},
    {p:"La relación de comando con el Comando de Operaciones establece que este autoriza:",o:["El presupuesto institucional","El régimen disciplinario","Los ascensos del personal","La coordinación funcional de los organismos"],c:3},
    {p:"Con relación al Comando, las Unidades deben:",o:["Elaborar la doctrina institucional","Aprobar las FPCON","Sustituir al JFACC","Dar impulso a los requerimientos de protección presentándolos al Comando de Operaciones"],c:3},
    {p:"La estructura operativa de la Fuerza Aérea comprende:",o:["Únicamente el Ministerio de Defensa","Únicamente la Policía Nacional","Únicamente el EMGRA","El Componente Aéreo de la Fuerza Conjunta (JFAC) y las Alas Aéreas"],c:3},
    {p:"El control centralizado de los recursos para la FP debe combinarse con una ejecución:",o:["Exclusivamente del más alto nivel","Exclusivamente civil","Nula, sin ejecución en campo","Descentralizada de las medidas de protección"],c:3},
    {p:"La responsabilidad del Comando en materia de FP debe estar clara para garantizar una respuesta:",o:["Lenta y fragmentada","Exclusivamente documental","Delegada sin supervisión","Amplia e integrada"],c:3},
    {p:"La integración de todos los aspectos de la FP debe permitir a los Comandantes:",o:["Delegar toda decisión al nivel más bajo","Ignorar la base legal de sus funciones","Suspender el planeamiento en tiempo de paz","Reaccionar rápidamente ante las amenazas"],c:3},
    {p:"La estructura de comando y control debe permitir orientar rápidamente los aspectos de:",o:["Solo la logística","Solo el abastecimiento de combustible","Solo la meteorología","La defensa pasiva y reaccionar rápidamente con medidas activas u ofensivas"],c:3},
    {p:"Capítulo de la Doctrina que trata la 'Organización para la Protección de la Fuerza':",o:["Capítulo II","Capítulo IV","Capítulo VI","Capítulo III"],c:3},
    {p:"El Capítulo III de la Doctrina aborda la responsabilidad del comando, las relaciones del comando y:",o:["Los niveles de amenaza","El proceso de gestión de riesgos","El glosario de términos","La estructura operativa de la Fuerza"],c:3},
    {p:"El CG-FAP es responsable de orientar:",o:["Únicamente las relaciones internacionales","Únicamente la doctrina de educación","Únicamente el mantenimiento de aeronaves","La organización, instrucción y equipamiento de las fuerzas"],c:3},
    {p:"El Comando de Operaciones coordina con los Comandos de Fuerza y:",o:["Organismos internacionales exclusivamente","La Policía Nacional exclusivamente","El sector privado exclusivamente","Unidades, la atención de sus requerimientos"],c:3},
    {p:"Elemento que sirve como Estado Mayor de planeamiento, coordinación y supervisión de todas las operaciones:",o:["El CAOC exclusivamente","La ESCAP","El Anexo B","El Estado Mayor del JFACC"],c:3},
    {p:"El CAOC es el lugar desde donde se planea y ejecuta:",o:["Únicamente las ceremonias institucionales","Únicamente las actividades educativas","Únicamente las relaciones públicas","La realización de operaciones diarias y las operaciones de FP"],c:3},
    {p:"En tiempo de paz, la responsabilidad de proteger a las unidades desplegadas dentro del área de responsabilidad recae en:",o:["El Ministerio de Defensa","La Comandancia General exclusivamente","El Congreso","Las Alas Aéreas"],c:3},
    {p:"Retos de los Comandantes Generales de Alas Aéreas para la FP: entrenamiento, planeamiento de integración y apoyo, y:",o:["Elaborar tratados internacionales","Aprobar el presupuesto nacional","Diseñar aeronaves nuevas","Proveer las fuerzas asignadas para la FP"],c:3},
    {p:"La responsabilidad de proteger los medios de la Fuerza Aérea recae en los Comandantes de:",o:["Solo el nivel estratégico","Solo el nivel táctico","Solo el nivel operacional","Todos los niveles"],c:3},
    {p:"El Componente Aéreo de la Fuerza Conjunta puede ser modificado en su estructura organizacional por su Comandante para:",o:["Reducir costos administrativos","Cumplir metas de reclutamiento","Modificar el glosario de términos","Ajustarse a las necesidades específicas de la misión"],c:3},
    {p:"El nivel al que estará el JFACC respecto a los Comandantes de los Componentes Terrestre y Marítimo es:",o:["Un nivel superior siempre","Un nivel inferior siempre","No tiene relación jerárquica","El mismo nivel"],c:3},
    {p:"Es el Comandante de la Fuerza Conjunta del cual depende operativa y administrativamente el JFACC:",o:["El CG-FAP","El Jefe de Seguridad","El Jefe de Escuadrón","El JFC"],c:3},
    {p:"Las amenazas abarcan desde actores estatales con armas convencionales y CBRNE, hasta actores no estatales con métodos:",o:["Exclusivamente convencionales","Exclusivamente navales","Exclusivamente aéreos","Inventivos, artesanales y asimétricos"],c:3},
    {p:"Estas amenazas pueden infligir daños catastróficos:",o:["Solo con previo aviso","Solo en zonas de combate declaradas","Solo contra instalaciones civiles","Con o sin previo aviso"],c:3},
    {p:"Son responsables de reconocer las amenazas a una misión durante todo el tiempo que esta dure:",o:["El personal de sanidad","El personal civil contratado","La Policía Nacional exclusivamente","Los Comandantes"],c:3},
    {p:"Las amenazas pueden provenir de terroristas, insurgentes, personas con información privilegiada, entidades criminales, fuerzas militares opositoras u:",o:["Organismos internacionales de cooperación","Instituciones educativas","Empresas de logística","Organizaciones extremistas violentas"],c:3},
    {p:"El personal militar debe enfocar la FP de forma proactiva y considerar escenarios:",o:["De negación total del riesgo","De eliminación completa de toda amenaza","De ausencia de planeamiento","'Qué pasaría si' para anticiparse a amenazas potenciales"],c:3},
    {p:"Fuerzas militares regulares apoyadas por un gobierno reconocido, incluyendo fuerzas aéreas, terrestres, marítimas y espaciales, se refiere a la amenaza:",o:["Irregular","Terrorista","Delictiva","Convencional"],c:3},
    {p:"Abarca operaciones militares y paramilitares llevadas a cabo por fuerzas autóctonas organizadas, entrenadas y dirigidas por una fuente externa; incluye la guerra de guerrillas:",o:["Amenaza convencional","Amenaza CBRNE","Amenaza psicológica","Amenaza irregular"],c:3},
    {p:"Implica el uso calculado de la violencia para infundir miedo, coaccionar o intimidar gobiernos o sociedades en la persecución de objetivos políticos, religiosos o ideológicos:",o:["Amenaza delictiva","Amenaza interna","Amenaza convencional","Amenaza terrorista"],c:3},
    {p:"El robo de vehículos, tarjetas de identificación militar o pases de entrada son indicadores potenciales de una acción hostil pendiente; se relaciona con la amenaza:",o:["Terrorista","Convencional","Psicológica","Delictiva"],c:3},
    {p:"Procede del personal civil o militar nacional u otras personas asignadas a una zona de operaciones, pudiendo revelar información sensible o clasificada:",o:["Amenaza irregular","Amenaza convencional","Amenaza de disturbios civiles","Amenaza interna"],c:3},
    {p:"Tiene como objetivo el bienestar psicológico y físico del personal de la FAP, pudiendo obstaculizar la eficacia de las operaciones tanto como un ataque real:",o:["Amenaza delictiva","Amenaza CBRNE","Amenaza convencional","Amenaza psicológica"],c:3},
    {p:"Puede producirse mediante una acción bélica, un ataque terrorista o un accidente militar o industrial, caracterizándose por diversos grados de letalidad y persistencia:",o:["Amenaza irregular","Amenaza interna","Amenaza psicológica","Amenaza CBRNE"],c:3},
    {p:"Refleja preocupaciones específicas de un país por la violencia de la población, manifestándose durante protestas o manifestaciones:",o:["Amenaza terrorista","Amenaza convencional","Amenaza a la información/datos","Amenaza de disturbios civiles"],c:3},
    {p:"Resulta de intentos de afectar negativamente los sistemas de información y redes informáticas de la Institución:",o:["Amenaza convencional","Amenaza delictiva","Amenaza de disturbios civiles","Amenaza a la información/datos"],c:3},
    {p:"Son nueve los tipos de amenaza descritos; señale la opción que NO corresponde a un tipo de amenaza:",o:["Amenaza irregular","Nivel de Amenaza III","Amenaza a la información/datos","Amenaza convencional"],c:1},
    {p:"Los tipos de amenazas proporcionan categorías generales cuya lista:",o:["Es absolutamente exhaustiva y cerrada","Solo aplica a amenazas de origen extranjero","Solo aplica en tiempo de guerra declarada","No es exhaustiva, pero puede utilizarse como guía"],c:3},
    {p:"Existen tres niveles de amenaza que requieren respuestas de seguridad para contrarrestarlos:",o:["Alfa, Bravo y Charlie","Normal, Alfa y Delta","Bajo, Medio y Alto","Nivel I, Nivel II y Nivel III"],c:3},
    {p:"Agentes, saboteadores, simpatizantes, terroristas y disturbios civiles son ejemplos del:",o:["Nivel de Amenaza II","Nivel de Amenaza III","FPCON Delta","Nivel de Amenaza I"],c:3},
    {p:"Pequeñas unidades tácticas y fuerzas irregulares con importantes amenazas de armas en pie de guerra corresponden al:",o:["Nivel de Amenaza I","Nivel de Amenaza III","FPCON Charlie","Nivel de Amenaza II"],c:3},
    {p:"Operaciones de grandes fuerzas tácticas, incluidas operaciones aerotransportadas, helitransportadas y anfibias, corresponden al:",o:["Nivel de Amenaza I","Nivel de Amenaza II","FPCON Bravo","Nivel de Amenaza III"],c:3},
    {p:"Las amenazas típicas de Nivel I incluyen agentes enemigos y terroristas cuyas misiones principales se consideran:",o:["Operaciones aerotransportadas de gran escala","Guerra convencional declarada","Bloqueo naval","El espionaje, el sabotaje y la subversión"],c:3},
    {p:"Contrarrestar las amenazas de Nivel I forma parte de:",o:["Únicamente operaciones especiales de gran escala","Únicamente acuerdos diplomáticos","Únicamente la defensa aérea activa","Las medidas cotidianas de FP aplicadas por todos los mandos"],c:3},
    {p:"El apoyo activo de una parte de la población civil es clave para contrarrestar las amenazas de:",o:["Nivel II","Nivel III","FPCON Delta","Nivel I"],c:3},
    {p:"Incluyen fuerzas a pequeña escala que llevan a cabo guerra irregular, consistiendo en atentados coordinados a pequeña escala, IED, VBIED y emboscadas:",o:["Amenazas de Nivel I","Amenazas de Nivel III","FPCON Alfa","Amenazas de Nivel II"],c:3},
    {p:"Pueden incluir fuerzas de operaciones especiales altamente entrenadas que buscan establecer redes de espionaje y llevar a cabo sabotajes:",o:["Amenazas de Nivel I","Amenazas de Nivel III","Amenaza psicológica","Amenazas de Nivel II"],c:3},
    {p:"Se pueden encontrar cuando un enemigo puede proyectar poder de combate en uno o más dominios, incluyendo operaciones aerotransportadas y anfibias:",o:["Amenazas de Nivel I","Amenazas de Nivel II","FPCON Charlie","Amenazas de Nivel III"],c:3},
    {p:"Pueden exceder la capacidad de las fuerzas de seguridad y defensas aéreas de las bases, requiriendo fuerzas adicionales o apoyo de fuego:",o:["Las amenazas de Nivel I","Las amenazas de Nivel II","La FPCON Normal","Las amenazas de Nivel III"],c:3},
    {p:"Las FPCON están dispuestas en un orden graduado que va de:",o:["FPCON Alfa a FPCON Charlie","Nivel I a Nivel III","FPCON Delta a FPCON Normal","FPCON Normal a FPCON Delta"],c:3},
    {p:"Se aplica en todo momento ya que siempre existe una amenaza general de ataques terroristas:",o:["FPCON Alfa","FPCON Bravo","FPCON Delta","FPCON Normal"],c:3},
    {p:"Se aplica a una amenaza no específica cuando un ataque es posible pero no existe información específica de una amenaza directa:",o:["FPCON Bravo","FPCON Charlie","FPCON Normal","FPCON Alfa"],c:3},
    {p:"Se aplica cuando existe una amenaza mayor o más predecible, probablemente afectando las misiones durante la implementación prolongada:",o:["FPCON Alfa","FPCON Delta","FPCON Charlie","FPCON Bravo"],c:3},
    {p:"Se aplica cuando ocurre un incidente terrorista dentro del área de interés del Comandante o se recibe información de inteligencia de un acto hostil probable:",o:["FPCON Bravo","FPCON Alfa","FPCON Normal","FPCON Charlie"],c:3},
    {p:"Se aplica cuando ha ocurrido o se anticipa un ataque contra instalaciones específicas, debiendo mantenerse de forma limitada:",o:["FPCON Charlie","FPCON Bravo","FPCON Alfa","FPCON Delta"],c:3},
    {p:"Los Comandantes deben ser capaces de mantener las medidas aplicables de FPCON Alfa:",o:["Solo por 24 horas","Solo por una semana","Nunca, dado que es transitoria","Indefinidamente"],c:3},
    {p:"Los mandos pueden aumentar o disminuir las FPCON en función de:",o:["Únicamente el clima","Únicamente el presupuesto disponible","Únicamente decisiones del Congreso","Las condiciones locales, información sobre amenazas o directrices superiores"],c:3},
    {p:"Las FPCON son medidas de seguridad promulgadas por el Comandante considerando el nivel de amenaza y:",o:["Únicamente el número de efectivos disponibles","Únicamente el presupuesto asignado","Únicamente la opinión pública internacional","Los acontecimientos actuales que podrían aumentar el riesgo"],c:3},
    {p:"Es muy probable que las medidas de esta FPCON afecten a las misiones, debiendo mantenerse durante toda la amenaza:",o:["FPCON Normal","FPCON Alfa","FPCON Bravo","FPCON Charlie"],c:3},
    {p:"El conocimiento profundo de los objetivos de las amenazas mejora:",o:["Únicamente el ascenso profesional","Únicamente la moral institucional","Únicamente el presupuesto de defensa","La planificación para contrarrestar las amenazas de FP"],c:3},

  let preguntasJuego = [];
  const letras = ["A", "B", "C", "D"];

  let indiceActual = 0;
  let puntaje = 0;
  let respondida = false;

  const elProgreso = document.getElementById("progreso");
  const elContador = document.getElementById("contador");
  const elTextoPregunta = document.getElementById("textoPregunta");
  const elOpciones = document.getElementById("opciones");
  const elMensaje = document.getElementById("mensaje");
  const btnSiguiente = document.getElementById("btnSiguiente");
  const vistaPregunta = document.getElementById("vistaPregunta");
  const vistaFinal = document.getElementById("vistaFinal");
  const btnReiniciar = document.getElementById("btnReiniciar");

  // Función para mezclar arreglos (Algoritmo Fisher-Yates)
  function mezclarArreglo(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
  }

  function inicializarJuego() {
    // Clonamos profundamente el banco maestro para no mutar el original
    preguntasJuego = JSON.parse(JSON.stringify(preguntasMaestras));

    // Preparamos las opciones para mantener el rastro de cuál es la correcta
    preguntasJuego.forEach(q => {
      // Convertimos el string de opciones en un objeto {texto, esCorrecta}
      q.opcionesObj = q.opciones.map((opTexto, idx) => ({
        texto: opTexto,
        esCorrecta: idx === q.correcta
      }));
      
      // Mezclamos las opciones internas de esta pregunta
      mezclarArreglo(q.opcionesObj);
    });

    // Mezclamos el orden general de las 100 preguntas
    mezclarArreglo(preguntasJuego);

    indiceActual = 0;
    puntaje = 0;
    
    // Mostramos la primera
    mostrarPregunta();
  }

  function pintarProgreso(){
    elProgreso.innerHTML = "";
    preguntasJuego.forEach((_, i) => {
      const p = document.createElement("div");
      p.className = "punto";
      if(i < indiceActual) p.classList.add("hecho");
      if(i === indiceActual) p.classList.add("activo");
      elProgreso.appendChild(p);
    });
  }

  function mostrarPregunta(){
    respondida = false;
    const q = preguntasJuego[indiceActual];

    pintarProgreso();
    elContador.textContent = `Pregunta ${indiceActual + 1} de ${preguntasJuego.length}`;
    elTextoPregunta.textContent = q.pregunta;
    elMensaje.textContent = "";
    elMensaje.className = "mensaje";
    btnSiguiente.classList.remove("mostrar");

    elOpciones.innerHTML = "";
    q.opcionesObj.forEach((opcion, i) => {
      const div = document.createElement("div");
      div.className = "opcion";
      div.innerHTML = `<span class="letra">${letras[i]}</span><span>${opcion.texto}</span>`;
      div.addEventListener("click", () => seleccionar(div, opcion.esCorrecta));
      elOpciones.appendChild(div);
    });
  }

  function seleccionar(elemento, esCorrecta){
    if(respondida) return;
    respondida = true;

    const q = preguntasJuego[indiceActual];
    const todasLasOpciones = document.querySelectorAll(".opcion");
    
    // Bloquear todas las opciones tras responder
    todasLasOpciones.forEach(op => op.classList.add("bloqueada"));

    if(esCorrecta){
      elemento.classList.add("correcta");
      elMensaje.textContent = "¡Correcto!";
      elMensaje.classList.add("ok");
      puntaje++;
    } else {
      elemento.classList.add("incorrecta");
      elMensaje.textContent = "Ups, respuesta incorrecta.";
      elMensaje.classList.add("no");
      
      // Resaltar automáticamente la respuesta que sí era correcta
      q.opcionesObj.forEach((op, idx) => {
        if(op.esCorrecta) {
          todasLasOpciones[idx].classList.add("correcta");
        }
      });
    }

    elemento.classList.add("seleccionada");
    btnSiguiente.classList.add("mostrar");
    btnSiguiente.textContent = (indiceActual === preguntasJuego.length - 1) ? "Ver resultado" : "Siguiente";
  }

  function siguientePregunta(){
    indiceActual++;
    if(indiceActual < preguntasJuego.length){
      mostrarPregunta();
    } else {
      mostrarFinal();
    }
  }

  function mostrarFinal(){
    vistaPregunta.style.display = "none";
    vistaFinal.classList.add("mostrar");

    document.getElementById("puntajeFinal").textContent = `${puntaje}/${preguntasJuego.length}`;

    const porcentaje = puntaje / preguntasJuego.length;
    let titulo, mensaje;
    if(porcentaje >= 0.9){
      titulo = "¡Excepcional!"; mensaje = "Tienes un dominio excelente de la Doctrina DOP 11-26.";
    } else if(porcentaje >= 0.6){
      titulo = "¡Muy bien hecho!"; mensaje = "Vas por buen camino, sigue repasando para perfeccionar.";
    } else {
      titulo = "¡A seguir practicando!"; mensaje = "Revisa los conceptos que fallaron y vuelve a intentarlo.";
    }
    document.getElementById("tituloFinal").textContent = titulo;
    document.getElementById("mensajeFinal").textContent = mensaje;
  }

  function reiniciar(){
    vistaFinal.classList.remove("mostrar");
    vistaPregunta.style.display = "block";
    // Al reiniciar, volvemos a generar la aleatoriedad total
    inicializarJuego(); 
  }

  btnSiguiente.addEventListener("click", siguientePregunta);
  btnReiniciar.addEventListener("click", reiniciar);

  // Iniciar la primera vez que carga la página
  inicializarJuego();
</script>

</body>
</html>
